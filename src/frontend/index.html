<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmDirect - Fresh from Farm to You</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Buy fresh produce directly from local farmers. No middlemen, fair prices." />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FarmDirect" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/generated/farmdirect-icon.dim_512x512.png" />
    <link rel="apple-touch-icon" href="/assets/generated/farmdirect-icon.dim_512x512.png" />

    <!-- iOS Splash Screen -->
    <link rel="apple-touch-startup-image" href="/assets/generated/farmdirect-splash.dim_1080x1920.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
